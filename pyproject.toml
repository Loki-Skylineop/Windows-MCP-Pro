[project]
name = "windows-mcp-pro"
version = "0.8.5"
description = "Coding-agent MCP server for Windows: shell, surgical file edits, code search, git and web research."
authors = [
    { name = "Jeomon George", email = "jeogeoalukka@gmail.com" }
]
maintainers = [
    { name = "Loki-Skylineop" }
]
readme = "README.md"
license = { file = "LICENSE.md" }
keywords = ["windows", "mcp", "ai", "ai agent", "coding agent", "powershell", "git", "web search"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: System :: Shells",
]
dependencies = [
    "click>=8.2.1",
    "comtypes>=1.4.15",
    "dxcam>=0.3.0",
    "fastmcp>=3.0",
    "fuzzywuzzy>=0.18.0",
    "markdownify>=1.1.0",
    "pillow>=11.2.1",
    "platformdirs>=4.3.8",
    "posthog>=7.4.0",
    "psutil>=7.0.0",
    "pygments>=2.20.0",
    "python-levenshtein>=0.27.1",
    "pywin32>=311",
    "requests>=2.33.0",
    "tabulate>=0.9.0",
    "thefuzz>=0.22.1",
    "uuid7>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Loki-Skylineop/Windows-MCP-Pro"
Repository = "https://github.com/Loki-Skylineop/Windows-MCP-Pro"
Issues = "https://github.com/Loki-Skylineop/Windows-MCP-Pro/issues"
Upstream = "https://github.com/CursorTouch/Windows-MCP"

[project.scripts]
windows-mcp-pro = "windows_mcp.__main__:main"
# Alias kept on purpose: 'uvx --from <this repo> windows-mcp' used to miss the
# renamed script and silently start the upstream package from PyPI instead.
windows-mcp = "windows_mcp.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/windows_mcp/uia/*.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
constraint-dependencies = ["pydantic-settings>=2.14.2"]

[tool.uv.extra-build-dependencies]
pyperclip = ["setuptools"]
